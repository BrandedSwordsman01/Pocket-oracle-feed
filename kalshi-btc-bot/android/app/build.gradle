plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketoracle.kalshibot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pocketoracle.kalshibot'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.2.0'
    }

    // One fixed signing key committed with the app so every CI build installs over the previous one.
    // (Personal sideloaded app; this key only proves builds come from this repo.)
    signingConfigs {
        fixed {
            storeFile file('kbot-release.keystore')
            storePassword 'kbotkbot'
            keyAlias 'kbot'
            keyPassword 'kbotkbot'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The UI + trading logic live in ../../web and are bundled as assets.
            assets.srcDirs = ['../../web']
        }
    }
}
