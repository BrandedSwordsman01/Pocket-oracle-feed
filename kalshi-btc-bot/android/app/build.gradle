plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketoracle.kalshibot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pocketoracle.kalshibot'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The UI + trading logic live in ../../web and are bundled as assets.
            assets.srcDirs = ['../../web']
        }
    }
}
